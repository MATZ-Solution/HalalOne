[pytest]
# rootdir is `backend/`, so the agent module's absolute imports
# (`log.logger`, `config.typesense_client`, `collection.search...`) resolve.
pythonpath = .
testpaths = tests

# `tests/agent_tests/test_summarizer.py` is a legacy hand-run script that calls the
# real LLM at import time. It matches `test_*.py` but is not a pytest test, so it is
# excluded from collection rather than deleted.
addopts =
    -q
    --strict-markers
    --ignore=tests/agent_tests/test_summarizer.py

asyncio_mode = auto

markers =
    unit: fast, fully isolated test — no network, no LLM, no Typesense.
