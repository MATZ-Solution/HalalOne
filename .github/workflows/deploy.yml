name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            cd /var/www/Halalify-TypeSense
            git pull origin main

            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            deactivate
            systemctl restart halalone-backend.service

            cd ../frontend
            npm install
            npm run build
            pm2 restart halalone-frontend || pm2 start npm --name halalone-frontend -- start
            pm2 save